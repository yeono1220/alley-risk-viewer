<title>생활도로 VLM 평가 뷰어</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 3 views on one page (summary / cases / detail), routed on hash. Dense evaluation-tool UI, GT and prediction always side by side and visually distinct. */
:root{
  --bg:#f6f5f2; --panel:#ffffff; --fg:#1d1f22; --muted:#6b6f76; --line:#dcdad4;
  --accent:#2457a6; --accent-soft:#e3ebf8;
  --gt:#2f6b3f; --gt-soft:#e4f0e6;      /* 사람 검수 정답 */
  --pred:#7a4a9e; --pred-soft:#efe6f6;  /* 모델 예측 */
  --danger:#b4322e; --danger-soft:#f8e3e1;
  --warn:#9a6300; --warn-soft:#fbefd3;
  --mock:#b35a00; --mock-soft:#ffe9d1;
  --font:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17191c; --panel:#202327; --fg:#e8e6e1; --muted:#9a9ea6; --line:#353940;
  --accent:#7ea4e6; --accent-soft:#1f2c42;
  --gt:#7cc48f; --gt-soft:#1d2f22; --pred:#c49ae8; --pred-soft:#2d2138;
  --danger:#ef8a85; --danger-soft:#3a2120; --warn:#e2b25a; --warn-soft:#3a2e14;
  --mock:#f0a35c; --mock-soft:#3a2a18; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17191c; --panel:#202327; --fg:#e8e6e1; --muted:#9a9ea6; --line:#353940;
  --accent:#7ea4e6; --accent-soft:#1f2c42;
  --gt:#7cc48f; --gt-soft:#1d2f22; --pred:#c49ae8; --pred-soft:#2d2138;
  --danger:#ef8a85; --danger-soft:#3a2120; --warn:#e2b25a; --warn-soft:#3a2e14;
  --mock:#f0a35c; --mock-soft:#3a2a18; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:600}
h1{font-size:18px}h2{font-size:15px}h3{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
a{color:var(--accent)}
button{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
select{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
  display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding-block:10px;margin-bottom:16px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.crumbs{display:flex;gap:6px;align-items:center;color:var(--muted);flex-wrap:wrap}
.crumbs b{color:var(--fg)}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:500;border:1px solid transparent;white-space:nowrap}
.pill.mock{background:var(--mock-soft);color:var(--mock);border-color:var(--mock)}
.pill.gt{background:var(--gt-soft);color:var(--gt)}
.pill.pred{background:var(--pred-soft);color:var(--pred)}
.pill.err{background:var(--danger-soft);color:var(--danger)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.neutral{background:var(--accent-soft);color:var(--accent)}
.pill.dim{border-color:var(--line);color:var(--muted)}
.mono{font-family:var(--mono);font-size:12px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px}
.grid{display:grid;gap:12px}
.cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:760px){.cols-4,.cols-3{grid-template-columns:repeat(2,minmax(0,1fr))}.cols-2{grid-template-columns:1fr}}
@media (max-width:420px){.cols-4,.cols-3{grid-template-columns:1fr}}
.stat .label{font-size:12px;color:var(--muted)}
.stat .val{font-size:26px;font-weight:600;line-height:1.1;margin-top:4px}
.stat .sub{font-size:12px;color:var(--muted);margin-top:4px}
.stat.clickable{cursor:pointer}.stat.clickable:hover{border-color:var(--accent)}
.stat .val.unm{font-size:15px;color:var(--muted);font-weight:500}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:500}
td.num,th.num{text-align:right}
.tablewrap{overflow-x:auto}
tr.row{cursor:pointer}tr.row:hover td{background:var(--accent-soft)}
.cnt{color:var(--accent);text-decoration:underline;cursor:pointer}
.section{display:grid;gap:12px;margin-bottom:22px}
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.filters .lbl{font-size:12px;color:var(--muted);margin-right:4px}
.thumb{width:72px;height:48px;border-radius:4px;border:1px solid var(--line);flex:none;background:#8d9aa6}
.thumb svg,.scene svg{display:block;width:100%;height:100%}
.scene{position:relative;aspect-ratio:16/10;max-width:100%;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#8d9aa6}
.scene .tag{position:absolute;top:8px;left:8px}
.zoom{position:absolute;right:8px;bottom:8px;display:flex;gap:4px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:760px){.cmp{grid-template-columns:1fr}}
.col{border-radius:8px;padding:12px;border:1px solid var(--line);background:var(--panel);min-width:0}
.col.gt{border-top:4px solid var(--gt)}.col.pred{border-top:4px solid var(--pred)}
.col h2{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.kv{display:grid;grid-template-columns:88px 1fr;gap:6px 10px;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0;min-width:0}
.kv dd.empty{color:var(--muted);font-style:italic}
.notice{border-left:3px solid var(--warn);background:var(--warn-soft);padding:8px 12px;border-radius:0 6px 6px 0;font-size:13px}
.notice.err{border-color:var(--danger);background:var(--danger-soft)}
.notice.info{border-color:var(--accent);background:var(--accent-soft)}
.empty{padding:40px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:8px}
.flow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.flow .step{padding:2px 8px;border:1px solid var(--line);border-radius:4px}
.flow .step.cur{border-color:var(--accent);color:var(--accent);font-weight:600}
.spec{font-size:12px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px;margin-top:4px}
.spec code{font-family:var(--mono);font-size:11px;background:var(--accent-soft);padding:0 4px;border-radius:3px}
details summary{cursor:pointer;color:var(--muted);font-size:12px}
.skel{height:14px;border-radius:4px;background:linear-gradient(90deg,var(--line),var(--panel),var(--line));background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}
.statebar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.statebar button{font-size:12px;padding:3px 8px}
.listrow{display:flex;gap:10px;align-items:flex-start}
.listrow .txt{min-width:0}
.wrapcol{min-width:0}
</style>
<div class="topbar">
  <h1>생활도로 VLM 평가 뷰어</h1>
  <span class="pill mock">가상 데이터 · 실제 모델 결과 아님</span>
  <div class="crumbs" id="crumbs"></div>
  <div class="flow" style="margin-left:auto">
    <span class="step" id="st1">F1 평가 요약</span>→<span class="step" id="st2">F2 오류 목록</span>→<span class="step" id="st3">F3 사례 상세</span>
  </div>
</div>
<div class="statebar" style="margin-bottom:14px">
  <span>예외 상태 미리보기:</span>
  <button data-state="normal" class="on">정상</button>
  <button data-state="loading">로딩</button>
  <button data-state="empty">결과 없음</button>
  <button data-state="apierror">조회 실패</button>
  <span class="muted">· 모든 화면은 같은 run_id로 연결됨 · 뒤로 가도 필터 유지</span>
</div>
<main id="app"></main>

<script>
const {run, taxonomy, cases} = DATA;

const state = { view:'summary', filters:{error:[], factor:null}, caseId:null, uiState:'normal' };
function go(view, patch={}){ Object.assign(state, patch); state.view=view; location.hash=view; render(); }
window.addEventListener('hashchange',()=>{const v=location.hash.replace('#','');if(['summary','cases','detail'].includes(v)&&v!==state.view){state.view=v;render();}});
document.querySelectorAll('.statebar button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.statebar button').forEach(x=>x.classList.remove('on'));b.classList.add('on');state.uiState=b.dataset.state;render();});

// ---- helpers ----
const pct=v=>v==null?'미측정':(v*100).toFixed(1)+'%';
const frac=m=>m.numerator!=null?`${m.numerator} / ${m.denominator}`:'';
const pill=(t,c='')=>`<span class="pill ${c}">${t}</span>`;
const errPill=id=>{const e=ERR[id];const cls=['miss','false_alarm','hallucination'].includes(id)?'err':['abstain','failure','label_review'].includes(id)?'warn':'neutral';return pill(e.label,cls);};
const judg=j=>j==null?pill('판정 없음','dim'):j==='위험'?pill('위험','err'):pill('안전','gt');
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
function filtered(){
  return cases.filter(c=>{
    if(state.filters.factor && !(c.gt.factors.includes(state.filters.factor))) return false;
    if(state.filters.error.length===0) return c.error_types.some(e=>e!=='label_review');
    return state.filters.error.some(e=>c.error_types.includes(e));
  });
}
// ---- placeholder scene drawing (not a real photo) ----
function scene(c, w=320, h=200){
  const night=c.conditions.includes('야간');
  const sky=night?'#2b3040':'#cfd8e0', road=night?'#4a4f58':'#8d9aa6', wall=night?'#3a3e48':'#b9b3a6';

  if(c.sample_id==='S-004') objs+=`<rect x="226" y="86" width="6" height="60" fill="#6a6a6a"/><rect x="60" y="130" width="22" height="16" fill="#5a8a4a"/>`;
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="가상 장면: ${esc(c.scene)}">
  <rect width="${w}" height="${h}" fill="${sky}"/>
  <rect x="0" y="60" width="${w}" height="${h}" fill="${wall}"/>
  <polygon points="130,60 190,60 ${w},${h} 0,${h}" fill="${road}"/>
  ${objs}
  ${night?`<circle cx="60" cy="40" r="10" fill="#ffd97a" opacity=".8"/><rect x="0" y="60" width="${w}" height="${h}" fill="#000" opacity=".35"/>`:''}
  <text x="6" y="${h-6}" font-size="9" fill="#fff" opacity=".8" font-family="monospace">placeholder · ${c.sample_id}</text>
</svg>`;
}
// ---- crumbs ----
function crumbs(){
  const parts=[`<b>${run.run_label}</b>`,`<span class="mono">${run.run_id}</span>`];
  if(state.view!=='summary'){const f=[...state.filters.error.map(e=>ERR[e].label)];if(state.filters.factor)f.push(FAC[state.filters.factor].label);parts.push('/ '+(f.length?f.join(' · '):'오류 전체'));}
  if(state.view==='detail'&&state.caseId)parts.push('/ '+state.caseId);
  document.getElementById('crumbs').innerHTML=parts.join(' ');
  ['st1','st2','st3'].forEach((id,i)=>document.getElementById(id).classList.toggle('cur',['summary','cases','detail'][i]===state.view));
}
// ---- render ----
function render(){
  crumbs();
  const app=document.getElementById('app');
  if(state.uiState==='loading'){app.innerHTML=`<div class="section"><div class="skel" style="width:40%"></div><div class="grid cols-4">${'<div class="card"><div class="skel" style="width:50%"></div><div class="skel" style="margin-top:10px;height:26px"></div></div>'.repeat(4)}</div><div class="skel" style="width:70%"></div><div class="skel"></div></div>`;return;}
  if(state.uiState==='apierror'){app.innerHTML=`<div class="notice err"><b>평가 결과를 불러오지 못했습니다.</b> GET /runs/${run.run_id} 응답 503. 네트워크 상태를 확인한 뒤 다시 시도하세요. <button onclick="document.querySelector('[data-state=normal]').click()">다시 시도</button></div>`;return;}
  if(state.uiState==='empty'){app.innerHTML=`<div class="empty"><b>저장된 평가 실행이 없습니다.</b><br>결과 파일(run.json + cases.json)을 가져오면 요약이 표시됩니다.<br><br><button class="primary">결과 파일 가져오기</button></div>`;return;}
  ({summary:renderSummary,cases:renderCases,detail:renderDetail})[state.view]();
  window.scrollTo({top:0});
}
function statCard(label,m,extra=''){
  const unm=m.value==null;
  return `<div class="card stat"><div class="label">${label}</div><div class="val num ${unm?'unm':''}">${unm?'미측정':pct(m.value)}</div><div class="sub">${unm?esc(m.note||m.status):frac(m)+(m.note?' · '+esc(m.note):'')}${extra}</div></div>`;
}
function countCard(label,n,err,sub=''){
  return `<div class="card stat clickable" onclick="go('cases',{filters:{error:['${err}'],factor:null}})"><div class="label">${label}</div><div class="val num">${n}</div><div class="sub">${sub||'클릭 → F2 목록'}</div></div>`;
}
function renderSummary(){
  const m=run.metrics,ec=run.error_counts,cn=run.counts;
  document.getElementById('app').innerHTML=`
  <div class="section">
    <div class="card" style="display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center">
      <label>평가 실행 <select id="runsel">
        <option>${run.run_label} · ${run.model.model_label}</option>
        ${run.other_runs.map(r=>`<option disabled>${r.model_label} — 미실행</option>`).join('')}
      </select></label>
      <span class="mono muted">데이터 ${run.dataset.dataset_id} · 라벨 ${run.dataset.label_version} · taxonomy ${run.dataset.taxonomy_version} · 프롬프트 ${run.model.prompt_version} · 채점 ${run.scorer.scorer_version}</span>
      ${pill('mock','mock')}
    </div>
    <div class="notice info">양성 기준: ${esc(run.scorer.positive_rule)} · ${esc(run.scorer.abstain_rule)}. 이 요약은 운행 확대 여부를 판정하지 않습니다.</div>
  </div>

  <div class="section">
    <h3>위험 판정 (M1)</h3>

      ${statCard('위험 Recall (보수적)',m.risk_recall_conservative)}
      ${statCard('위험 Recall (응답 사례만)',m.risk_recall_answered_only)}
      ${statCard('위험 Precision',m.risk_precision)}
      <div class="card stat"><div class="label">표본</div><div class="val num">${cn.scored}<span class="muted" style="font-size:14px"> / ${cn.attempted}</span></div><div class="sub">채점 ${cn.scored} · 양성 ${cn.gt_positive} · 음성 ${cn.gt_negative} · 재검토 제외 ${cn.excluded_label_review}</div></div>
    </div>
  </div>

  <div class="section">
    <h3>오류 건수 — 클릭하면 해당 조건의 목록으로</h3>
    <div class="grid cols-4">
      ${countCard('미탐 (GT 위험 → 안전)',ec.miss,'miss')}
      ${countCard('오경보 (GT 안전 → 위험)',ec.false_alarm,'false_alarm')}
      ${countCard('행동 오류',ec.action,'action')}
      ${countCard('객체 오류',ec.object,'object')}
      ${countCard('근거 오류',ec.evidence,'evidence')}
      ${countCard('환각',ec.hallucination,'hallucination')}
      ${countCard('판단 보류',ec.abstain,'abstain','모델이 스스로 보류')}
      ${countCard('형식 오류·호출 실패',ec.failure,'failure','백엔드 실행 상태')}
    </div>
    <div class="muted" style="font-size:12px">한 사례가 여러 오류를 가질 수 있어 합계(${Object.values(ec).filter(v=>typeof v==='number').slice(0,-1).reduce((a,b)=>a+b,0)}) ≠ 오류 사례 수(<span class="cnt" onclick="go('cases',{filters:{error:[],factor:null}})">${ec.cases_with_any_error}</span>). 라벨 재검토 ${ec.label_review}건은 채점 제외.</div>
  </div>

  <div class="section">
    <h3>그 외 지표 (M3 · M4 · M5 · M2 · M7 · M6)</h3>
    <div class="grid cols-3">
      ${statCard('환각률',m.hallucination_rate)}
      ${statCard('행동 정확도',m.action_accuracy)}
      ${statCard('schema 통과율',m.schema_pass_rate)}
      ${statCard('객체 인식 F1',m.object_f1)}
      ${statCard('근거 품질',m.evidence_quality)}
      ${statCard('지연 p50',m.latency_p50_ms)}
    </div>
  </div>

  <div class="section">
    <h3>위험 요인별 — 행 클릭 시 해당 요인으로 필터</h3>
    <div class="card tablewrap"><table>
      <tr><th>요인</th><th class="num">n</th><th class="num">TP</th><th class="num">미탐</th><th class="num">오경보</th><th class="num">보류</th><th class="num">실패</th><th class="num">Recall</th><th class="num">Precision</th><th>비고</th></tr>
      ${run.by_factor.map(f=>`<tr class="row" onclick="go('cases',{filters:{error:[],factor:'${f.factor_id}'}})"><td>${f.factor_id} ${f.factor_label}</td><td class="num">${f.n}</td><td class="num">${f.tp}</td><td class="num">${f.fn}</td><td class="num">${f.fp}</td><td class="num">${f.abstain}</td><td class="num">${f.failure}</td><td class="num">${f.recall==null?'<span class="muted">—</span>':pct(f.recall)}</td><td class="num">${f.precision==null?'<span class="muted">—</span>':pct(f.precision)}</td><td class="muted">${esc(f.note||'')}</td></tr>`).join('')}
    </table></div>
    <div class="muted" style="font-size:12px">표본이 작아 신뢰구간을 계산하지 않았습니다. 순위만으로 개선 우선순위를 확정하지 않습니다.</div>
  </div>

  <div class="section"><div class="spec">
    <b>F1 백엔드 요구:</b> <code>GET /runs</code> (목록: run_id, run_label, model_label, dataset_id, data_kind) · <code>GET /runs/{run_id}/summary</code> (metrics·counts·error_counts·by_factor 위 run.json 구조) · 미측정은 <code>null + status:"unmeasured"</code>, 0으로 보내지 않음.
  </div></div>`;
}
function renderCases(){
  const list=filtered();
  const errBtn=id=>`<button class="${state.filters.error.includes(id)?'on':''}" onclick="toggleErr('${id}')">${ERR[id].label}</button>`;
  document.getElementById('app').innerHTML=`
  <div class="section">
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button onclick="go('summary')">← F1 요약으로</button><h2>오류 사례 목록</h2><span class="muted num">${list.length}건</span></div>
    <div class="card" style="display:grid;gap:8px">
      <div class="filters"><span class="lbl">오류 유형</span>${taxonomy.error_types.map(e=>errBtn(e.id)).join('')}<button onclick="state.filters.error=[];render()" class="muted">전체 오류</button></div>
      <div class="filters"><span class="lbl">위험 요인</span><select id="facsel" onchange="state.filters.factor=this.value||null;render()"><option value="">전체</option>${taxonomy.factors.map(f=>`<option value="${f.id}" ${state.filters.factor===f.id?'selected':''}>${f.id} ${f.label}</option>`).join('')}</select>
      <span class="lbl" style="margin-left:8px">정렬</span><select><option>오류 유형 → sample_id</option><option disabled>confidence (미정)</option></select></div>
    </div>
    ${list.length===0?`<div class="empty">조건에 맞는 사례가 없습니다. 필터를 해제해 보세요.</div>`:`
    <div class="card tablewrap"><table>
      <tr><th>이미지</th><th>sample_id</th><th>장면 (가상)</th><th>GT 판정</th><th>예측 판정</th><th>오류 유형</th><th>요인</th><th>상태</th></tr>
      ${list.map(c=>`<tr class="row" onclick="go('detail',{caseId:'${c.sample_id}'})">
        <td><div class="thumb">${scene(c,72,48)}</div></td>
        <td class="mono">${c.sample_id}</td>
        <td style="min-width:180px">${esc(c.scene)}</td>
        <td>${c.status==='label_review'?pill('재검토 대기','warn'):judg(c.gt.judgment)}</td>
        <td>${c.pred?judg(c.pred.judgment):pill('없음 (실패)','dim')}</td>
        <td>${c.error_types.map(errPill).join(' ')||'<span class="muted">—</span>'}</td>
        <td class="mono">${c.gt.factors.join(', ')}</td>
        <td class="mono muted">${c.status}</td></tr>`).join('')}
    </table></div>`}
  </div>
  <div class="section"><div class="spec">
    <b>F2 백엔드 요구:</b> <code>GET /runs/{run_id}/cases?error_type=miss,hallucination&factor=F2&status=&page=1&size=50</code> → 각 행: sample_id, thumbnail_url, scene(선택), gt.judgment, pred.judgment, error_types[], gt.factors[], status. 페이지네이션은 200장 이상이면 필요. 정렬 기준은 confidence 정의 후 추가.
  </div></div>`;
}
function toggleErr(id){const a=state.filters.error;const i=a.indexOf(id);i>=0?a.splice(i,1):a.push(id);render();}
function renderDetail(){
  const list=filtered(); let idx=list.findIndex(c=>c.sample_id===state.caseId);
  const c=cases.find(x=>x.sample_id===state.caseId)||list[0]; if(!c){go('cases');return;}
  const p=c.pred,g=c.gt;
  const dd=v=>v==null||(Array.isArray(v)&&v.length===0)?'<dd class="empty">미등록</dd>':`<dd>${Array.isArray(v)?v.map(esc).join(', '):esc(v)}</dd>`;
  const cmp=(()=>{
    if(c.status==='label_review')return `<div class="notice">GT 미확정: ${esc(g.review_reason)} — 채점에서 제외되었고 제외 사유를 공개합니다.</div>`;
    if(c.status==='format_error'||c.status==='call_failed')return `<div class="notice err"><b>${c.failure.code}</b> ${esc(c.failure.message)} · 재시도 ${c.failure.retry_count}회 · ${c.failure.retryable?'재시도 가능':'재시도 불가'}. 모델 판단 보류와는 다른 상태입니다. <button>재시도 요청</button></div><details><summary>원본 응답 일부</summary><pre class="mono" style="white-space:pre-wrap">${esc(c.raw_response_excerpt)}</pre></details>`;
    if(c.status==='abstain')return `<div class="notice">판단 보류 · 사유: ${esc(p.abstain_reason)} · 부족한 정보: ${esc(p.limits)}. '낮은 위험'으로 해석하지 않으며, 보수적 집계에서는 미검출로 포함됩니다.</div>`;
    const same=g.judgment===p.judgment;
    return `<div class="notice ${same?'info':'err'}"><b>판정 ${same?'일치':'불일치'}</b> · ${c.error_types.length?c.error_types.map(errPill).join(' '):'기록된 오류 없음'}${same&&c.error_types.length?' — 판정이 맞아도 근거까지 맞다는 뜻은 아닙니다. 아래 근거를 따로 읽으세요.':''}</div>`;
  })();
  document.getElementById('app').innerHTML=`
  <div class="section">
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <button onclick="go('cases')">← 목록으로 (필터 유지)</button>
      <h2 class="mono">${c.sample_id}</h2>${c.conditions.map(t=>pill(t,'dim')).join('')}${pill('mock','mock')}
      <span style="margin-left:auto;display:flex;gap:6px"><button ${idx<=0?'disabled':''} onclick="go('detail',{caseId:'${list[idx-1]?.sample_id}'})">← 이전</button><span class="muted num" style="align-self:center">${idx+1} / ${list.length}</span><button ${idx>=list.length-1?'disabled':''} onclick="go('detail',{caseId:'${list[idx+1]?.sample_id}'})">다음 →</button></span>
    </div>
    ${cmp}
    <div class="grid cols-2" style="grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)">
      <div class="wrapcol">
        <div class="scene" id="scene">${scene(c)}<span class="tag pill mock">가상 이미지 · 실제 사진 아님</span><div class="zoom"><button onclick="zoomScene(1.5)">+</button><button onclick="zoomScene(1)">1:1</button></div></div>
        <div class="muted" style="font-size:12px;margin-top:6px">${esc(c.scene)}. bbox 오버레이(GT/예측 구분)는 좌표 규약 협의 후 추가.</div>
      </div>
      <div class="card wrapcol">
        <h3>검수 결과</h3>
        ${c.review?`<dl class="kv"><dt>검수자</dt><dd>${esc(c.review.reviewer)}</dd><dt>근거 적절</dt><dd>${c.review.evidence_ok==null?'<span class="muted">검수 보류</span>':c.review.evidence_ok?pill('적절','gt'):pill('부적절','err')}</dd><dt>메모</dt><dd>${esc(c.review.note)}</dd></dl>`:'<p class="muted">검수 기록 없음</p>'}
        <div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap"><button>검토 메모 추가</button><button>오류 유형 수정</button><button disabled>다른 모델 결과 비교 (미실행)</button></div>
      </div>
    </div>
    <div class="cmp">
      <div class="col gt"><h2>${pill('GT','gt')} 사람이 검수한 정답</h2>
        <dl class="kv"><dt>판정</dt><dd>${judg(g.judgment)} ${g.risk_level?pill(g.risk_level,'dim'):''}</dd>
        <dt>위험 요인</dt>${dd(g.factors.map(f=>f+' '+FAC[f].label))}
        <dt>관측 객체</dt>${dd(g.objects)}
        <dt>근거</dt>${dd(g.evidence)}
        <dt>허용 행동</dt>${dd(g.allowed_actions)}</dl>
        <div class="muted" style="font-size:12px;margin-top:8px">라벨 ${run.dataset.label_version} · taxonomy ${run.dataset.taxonomy_version}</div>
      </div>
      <div class="col pred"><h2>${pill('예측','pred')} 모델 출력 <span class="muted" style="font-weight:400;font-size:12px">${run.model.model_label}</span></h2>
        ${p?`<dl class="kv"><dt>판정</dt><dd>${judg(p.judgment)} ${p.risk_level?pill(p.risk_level,'dim'):''}</dd>
        <dt>위험 요인</dt>${dd(p.factors.map(f=>f+' '+FAC[f].label))}
        <dt>관측 객체</dt>${dd(p.objects)}
        <dt>관측 사실</dt>${dd(p.observed)}
        <dt>추론</dt>${dd(p.inference)}
        <dt>권장 행동</dt>${dd(p.action)}
        <dt>판단 한계</dt>${dd(p.limits)}
        <dt>confidence</dt><dd><span class="pill warn">미정</span> <span class="muted" style="font-size:12px">산출·보정 방법 확정 전. 사고 확률이 아님.</span></dd></dl>`:'<p class="muted">출력 없음 (실행 실패)</p>'}
      </div>
    </div>
  </div>
  <div class="section"><div class="spec">
    <b>F3 백엔드 요구:</b> <code>GET /runs/{run_id}/cases/{sample_id}</code> → image_url(원본, 확대용 고해상도), gt{judgment,risk_level,factors[],objects[],evidence,allowed_actions[]}, pred{…,observed,inference,action,limits,confidence:null,abstain_reason}, status, failure{code,message,retry_count}, review{reviewer,evidence_ok,note}, error_types[]. <code>POST …/review</code> (메모·오류 유형 저장). 이전/다음은 F2와 같은 필터 쿼리로 계산.
  </div></div>`;
}
let z=1;function zoomScene(f){z=f;const s=document.querySelector('#scene svg');s.style.transform=`scale(${z})`;s.style.transformOrigin='center';}
const v0=location.hash.replace('#','');if(['summary','cases','detail'].includes(v0))state.view=v0;if(state.view==='detail'&&!state.caseId)state.caseId='S-002';
render();
</script>
