<title>생활도로 VLM 평가 뷰어</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: left rail F1–F5 + content column (max 1200). Semantic colors are fixed by the spec: GT green (solid), 예측 violet (dashed), C red region; P/A/U are judgments, never error-colored; pass/fail carry text labels. */
:root{
  --bg:#f4f3f0; --panel:#ffffff; --panel-2:#faf9f7; --fg:#1b1d20; --muted:#71757c; --line:#e3e1dc; --line-2:#cfccc4;
  --accent:#1d4f8c; --accent-soft:#e6edf7; --accent-ink:#ffffff;
  --gt:#2a6b43; --gt-soft:#e2f0e6; --pred:#6b3fa0; --pred-soft:#ede5f6; --c:#c2402f; --c-soft:rgba(194,64,47,.14);
  --pass:#2a6b43; --pass-soft:#e2f0e6; --fail:#b3362f; --fail-soft:#f9e5e3; --warn:#946200; --warn-soft:#fbf0d4;
  --u:#4a5d78; --u-soft:#e7ecf3;
  --mock:#b15a00; --mock-soft:#ffe9d2;
  --font:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace; --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141618; --panel:#1d2024; --panel-2:#22262b; --fg:#e8e6e1; --muted:#9b9fa6; --line:#2e3238; --line-2:#3f444c;
  --accent:#86aee6; --accent-soft:#1d2a3f; --accent-ink:#0f1419;
  --gt:#86cc9a; --gt-soft:#1c2f23; --pred:#c7a3ee; --pred-soft:#2c2139; --c:#f08a7a; --c-soft:rgba(240,138,122,.18);
  --pass:#86cc9a; --pass-soft:#1c2f23; --fail:#f0918a; --fail-soft:#3a2321; --warn:#e4b65e; --warn-soft:#382d15;
  --u:#9fb4d1; --u-soft:#25303f; --mock:#f2a65f; --mock-soft:#3a2b19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141618; --panel:#1d2024; --panel-2:#22262b; --fg:#e8e6e1; --muted:#9b9fa6; --line:#2e3238; --line-2:#3f444c;
  --accent:#86aee6; --accent-soft:#1d2a3f; --accent-ink:#0f1419;
  --gt:#86cc9a; --gt-soft:#1c2f23; --pred:#c7a3ee; --pred-soft:#2c2139; --c:#f08a7a; --c-soft:rgba(240,138,122,.18);
  --pass:#86cc9a; --pass-soft:#1c2f23; --fail:#f0918a; --fail-soft:#3a2321; --warn:#e4b65e; --warn-soft:#382d15;
  --u:#9fb4d1; --u-soft:#25303f; --mock:#f2a65f; --mock-soft:#3a2b19; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:600}
h1{font-size:17px}h2{font-size:14.5px}
h3{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:500}
a{color:var(--accent)}
button,select,input[type=text]{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line-2);border-radius:7px;padding:6px 11px}
button{cursor:pointer}button:hover{border-color:var(--accent)}button:disabled{opacity:.5;cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:500}
button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
button.ghost{background:transparent;border-color:transparent;color:var(--muted)}button.ghost:hover{color:var(--accent)}
button.sm{padding:4px 10px;font-size:12.5px}
.shell{display:grid;grid-template-columns:204px minmax(0,1fr);gap:28px;max-width:1260px;margin:0 auto}
@media (max-width:860px){.shell{grid-template-columns:1fr;gap:12px}}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);align-self:start;display:flex;flex-direction:column;gap:4px;padding-top:20px}
@media (max-width:860px){.rail{position:static;flex-direction:row;flex-wrap:wrap;padding-top:12px}}
.brand{padding:0 10px 14px;display:grid;gap:6px}.brand .t{font-weight:600;font-size:15px}
.rail a.nav{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:7px;color:var(--muted);text-decoration:none;font-size:13.5px}
.rail a.nav .k{font-family:var(--mono);font-size:11px;width:22px;color:var(--muted)}
.rail a.nav:hover{background:var(--panel)}
.rail a.nav.cur{background:var(--panel);color:var(--fg);box-shadow:inset 3px 0 0 var(--accent)}.rail a.nav.cur .k{color:var(--accent)}
.railfoot{margin-top:18px;padding:0 10px;display:grid;gap:6px;font-size:11.5px;color:var(--muted)}
.main{padding-top:20px;display:grid;gap:20px;min-width:0;align-content:start}
.head{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.head .crumb{font-size:12.5px;color:var(--muted)}.head .crumb b{color:var(--fg);font-weight:500}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:500;white-space:nowrap;line-height:1.5}
.pill.mock{background:var(--mock-soft);color:var(--mock)}
.pill.gt{background:var(--gt-soft);color:var(--gt)}.pill.pred{background:var(--pred-soft);color:var(--pred)}
.pill.pass{background:var(--pass-soft);color:var(--pass)}.pill.fail{background:var(--fail-soft);color:var(--fail)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.neutral{background:var(--accent-soft);color:var(--accent)}
.pill.dim{background:var(--panel-2);color:var(--muted);border:1px solid var(--line)}
.pill.P{background:var(--fg);color:var(--bg)}.pill.A{background:var(--panel-2);color:var(--muted);border:1px solid var(--line-2)}.pill.U{background:var(--u-soft);color:var(--u)}
.pill.na{background:transparent;color:var(--muted);border:1px dashed var(--line-2)}
.mono{font-family:var(--mono);font-size:12px}.num{font-variant-numeric:tabular-nums}.muted{color:var(--muted)}.small{font-size:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}.card.flat{background:var(--panel-2)}
.section{display:grid;gap:10px}.grid{display:grid;gap:10px}
.cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:900px){.cols-4,.cols-3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.cols-4,.cols-3,.cols-2{grid-template-columns:1fr}}
.stat{display:grid;gap:2px;padding:14px 16px}.stat .label{font-size:12px;color:var(--muted)}
.stat .val{font-size:26px;font-weight:600;line-height:1.15;letter-spacing:-.01em}.stat .sub{font-size:11.5px;color:var(--muted);margin-top:4px}
.stat.click{cursor:pointer}.stat.click:hover{border-color:var(--accent)}.stat.click .val{color:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11.5px;color:var(--muted);font-weight:500;letter-spacing:.03em}tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}.tablewrap{overflow-x:auto}
tr.row{cursor:pointer}tr.row:hover td{background:var(--panel-2)}tr.row.on td{background:var(--accent-soft)}
.cnt{color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.filters .lbl{font-size:12px;color:var(--muted);min-width:64px}
.notice{border-left:3px solid var(--warn);background:var(--warn-soft);padding:9px 13px;border-radius:0 7px 7px 0;font-size:13px}
.notice.fail{border-color:var(--fail);background:var(--fail-soft)}.notice.info{border-color:var(--accent);background:var(--accent-soft)}.notice.pass{border-color:var(--pass);background:var(--pass-soft)}
.empty{padding:44px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line-2);border-radius:var(--r);display:grid;gap:10px;justify-items:center}
details.dev{font-size:12px;color:var(--muted)}details.dev summary{cursor:pointer;list-style:none;display:inline-flex;gap:6px;align-items:center}
details.dev summary::before{content:"›";display:inline-block;transition:transform .12s}details.dev[open] summary::before{transform:rotate(90deg)}
details.dev .body{margin-top:8px;padding:10px 12px;background:var(--panel-2);border-radius:7px;line-height:1.6}
details.dev code{font-family:var(--mono);font-size:11px;background:var(--accent-soft);color:var(--accent);padding:0 5px;border-radius:3px}
.skel{height:14px;border-radius:4px;background:linear-gradient(90deg,var(--line),var(--panel),var(--line));background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.ci{font-size:11.5px;color:var(--muted);font-family:var(--mono)}
.verdict{font-weight:600}.verdict.improved{color:var(--pass)}.verdict.not_confirmed{color:var(--muted)}
.sp{flex:1}.wrapcol{min-width:0}
.scene{position:relative;aspect-ratio:16/10;max-width:100%;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#8d9aa6}
.scene svg{display:block;width:100%;height:100%}
.scene .tag{position:absolute;top:10px;left:10px}
.layers{position:absolute;right:10px;top:10px;display:flex;gap:4px}.layers button{padding:2px 8px;font-size:11.5px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:18px;height:11px;border:2px solid;margin-right:5px;vertical-align:-1px;border-radius:2px}
.legend i.c{border-color:var(--c);background:var(--c-soft);border-style:dashed}.legend i.g{border-color:var(--gt)}.legend i.p{border-color:var(--pred);border-style:dashed}
.chain{display:grid;gap:6px}.chain .step{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--panel);display:grid;gap:6px}
.chain .step.gt{border-color:var(--gt)}.chain .step.pred{border-color:var(--pred)}.chain .step.last{background:var(--panel-2)}
.chain .arrow{text-align:center;color:var(--muted);line-height:1}
.chain .t{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:flex;gap:6px;align-items:center}
.kv{display:grid;grid-template-columns:72px 1fr;gap:6px 10px;font-size:13px;margin:0}.kv dt{color:var(--muted)}.kv dd{margin:0;min-width:0}
.rels{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}@media (max-width:600px){.rels{grid-template-columns:repeat(2,minmax(0,1fr))}}
.rel{border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:grid;gap:4px;font-size:12.5px;background:var(--panel)}
.rel .n{font-family:var(--mono);font-size:11px;color:var(--muted)}.rel .vs{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media (max-width:860px){.cmp{grid-template-columns:1fr}}
.col{border-radius:var(--r);padding:16px;border:1px solid var(--line);background:var(--panel);min-width:0;position:relative}
.col::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;border-radius:var(--r) var(--r) 0 0}
.col.gt::before{background:var(--gt)}.col.pred::before{background:var(--pred)}.col.a::before{background:var(--accent)}.col.b::before{background:var(--pred)}
.col h2{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.field{display:grid;gap:5px}.field label{font-size:12px;color:var(--muted)}.field input[type=text],.field select{width:100%}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line-2);display:inline-block;margin-right:6px}
.dot.run{background:var(--accent);animation:pulse 1s infinite}.dot.ok{background:var(--pass)}.dot.err{background:var(--fail)}.dot.q{background:var(--warn)}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.skel,.dot.run{animation:none}.bar i{transition:none}}
.actlist{display:grid;gap:4px}.actlist .a,.a{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.code{font-family:var(--mono);font-size:11px;color:var(--muted)}
</style>

<div class="shell">
  <nav class="rail">
    <div class="brand"><div class="t">생활도로 VLM 평가 뷰어</div><span class="pill mock">가상 데이터</span></div>
    <a class="nav" href="#run" data-v="run"><span class="k">F1</span>평가 실행</a>
    <a class="nav" href="#report" data-v="report"><span class="k">F2</span>결과 Report</a>
    <a class="nav" href="#errors" data-v="errors"><span class="k">F3</span>오류 목록</a>
    <a class="nav" href="#compare" data-v="compare"><span class="k">F4</span>모델 비교</a>
    <a class="nav" href="#scene" data-v="scene"><span class="k">F5</span>장면 상세</a>
    <div class="railfoot">
      <div>Test <span class="mono" id="railtest"></span></div>
      <div>Base = 미세조정 전 · Tuned = LoRA. 모든 화면은 같은 Test Version에 고정.</div>
      <details class="dev"><summary>상태 화면 미리보기</summary><div class="body" style="display:flex;gap:4px;flex-wrap:wrap">
        <button class="sm on" data-state="normal">정상</button><button class="sm" data-state="before">평가 전</button><button class="sm" data-state="running">실행 중</button><button class="sm" data-state="runerror">실행 오류</button></div></details>
    </div>
  </nav>
  <main class="main" id="app"></main>
</div>

  const px=b=>[b[0]*W,b[1]*H,(b[2]-b[0])*W,(b[3]-b[1])*H];
  let g='';
  sc.reference.objects.forEach(o=>{const [x,y,w,h]=px(o.bbox);const ped=o.class==='pedestrian';const col=ped?'#d94a3d':o.kind==='Obstacle'?'#8a7a5a':'#5b6773';g+=`<rect x="${x+w*.15}" y="${y+h*.1}" width="${w*.7}" height="${h*.85}" rx="${ped?w*.3:4}" fill="${col}" opacity=".9"/>`;});
  let c='';if(L.c){c=`<polygon points="${sc.C.map(p=>p[0]*W+','+p[1]*H).join(' ')}" fill="var(--c-soft)" stroke="var(--c)" stroke-width="2" stroke-dasharray="6 4"/><text x="${sc.C[3][0]*W+10}" y="${H-10}" font-size="13" font-weight="600" fill="var(--c)">C</text>`;}
  let gt='';if(L.gt){sc.reference.regions.forEach(o=>{const [x,y,w,h]=px(o.bbox);gt+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="var(--gt-soft)" fill-opacity=".45" stroke="var(--gt)" stroke-width="1.5" stroke-dasharray="2 3"/><text x="${x+3}" y="${y+13}" font-size="11" font-weight="600" fill="var(--gt)">${o.id} ${esc(o.class)}</text>`;});sc.reference.objects.forEach(o=>{const [x,y,w,h]=px(o.bbox);gt+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="none" stroke="var(--gt)" stroke-width="2.5"/><text x="${x+3}" y="${y-5}" font-size="12" font-weight="600" fill="var(--gt)">${o.id}</text>`;});}
  let pr='';const p=sc.predictions[m];if(L.pred&&p&&p.valid){p.regions.forEach(o=>{const [x,y,w,h]=px(o.bbox);pr+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="none" stroke="var(--pred)" stroke-width="1.5" stroke-dasharray="2 3"/><text x="${x+w-3}" y="${y+13}" font-size="11" font-weight="600" text-anchor="end" fill="var(--pred)">${o.id}′</text>`;});p.objects.forEach(o=>{const [x,y,w,h]=px(o.bbox);pr+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="none" stroke="var(--pred)" stroke-width="2.5" stroke-dasharray="7 4"/><text x="${x+w-3}" y="${y+h+14}" font-size="12" font-weight="600" text-anchor="end" fill="var(--pred)">${o.id}′</text>`;});}
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="가상 장면 ${esc(sc.scene_id)}">
  <rect width="${W}" height="${H}" fill="${sky}"/><rect y="${H*.3}" width="${W}" height="${H}" fill="${wall}"/>
  <polygon points="${W*.42},${H*.3} ${W*.58},${H*.3} ${W},${H} 0,${H}" fill="${road}"/>
  ${night?`<rect width="${W}" height="${H}" fill="#000" opacity=".35"/>`:''}${g}${c}${gt}${pr}
  <text x="8" y="${H-8}" font-size="10" fill="#fff" opacity=".7" font-family="monospace">placeholder · 실제 사진 아님</text></svg>`;
}
function sceneBox(sc,m){return `<div class="scene">${sceneSVG(sc,m)}<span class="tag pill mock">가상 이미지</span>
  <div class="layers"><button class="${state.layers.c?'on':''}" onclick="tl('c')">C</button><button class="${state.layers.gt?'on':''}" onclick="tl('gt')">정답</button><button class="${state.layers.pred?'on':''}" onclick="tl('pred')">예측</button></div></div>

function tl(k){state.layers[k]=!state.layers[k];render();}

/* ---- filtering for F3 ---- */
function failing(m){return scored.filter(s=>{const sc=s.scoring[m];return sc.pass===false||sc.diag.length>0;});}
function filtered(){
  const m=state.model,F=state.filters;
  return failing(m).filter(s=>{
    const sc=s.scoring[m];
    if(F.diag.length&&!F.diag.some(d=>sc.diag.includes(d)))return false;
    if(F.rel&&!(sc.relations[F.rel]&&sc.relations[F.rel].ok===false))return false;
    if(F.cond&&!s.conditions.includes(F.cond))return false;
    return true;});
}

  }

}

function startRun(retry){const R=state.run;if(!retry){R.done=0;R.failed=0;}R.status='running';render();

      <td class="mono small">${relErr.join(', ')||'<span class="muted">—</span>'}</td></tr>`;}).join('')}
  </table></div>`}
  <div class="small muted">U3: 필요 대응 누락과 금지 대응을 구분해 보여 준다. 실패 사유 5종(형식 오류 · 필요 대응 누락 · 금지 대응 · 근거가 확인되지 않은 대응 · 관계 판정과의 모순)은 색만으로 구분하지 않고 이름표를 함께 표시한다. Invalid와 Timeout은 별도 상태.</div>
  ${dev('F3 백엔드 요구',`<code>GET /runs/{run_id}/scenes?status=fail&diag=evidence,bias&relation=R3&condition=야간&page=&size=</code> → scene_id, conditions, thumbnail_url, scoring{pass, fail_reasons[], diag[], relations{R1..R4:{gt,pred,ok}}}. 정렬: 실패 사유 수 → scene_id.`)}`;
}
function toggleDiag(k){const a=state.filters.diag;const i=a.indexOf(k);i>=0?a.splice(i,1):a.push(k);render();}

/* ---------- F4 모델 비교 ---------- */
function renderCompare(){
  const sel=(state.sceneId&&scored.find(x=>x.scene_id===state.sceneId))?state.sceneId:'S-0002';const s=scenes.find(x=>x.scene_id===sel);
  const rows=scored.map(x=>`<tr class="row ${x.scene_id===sel?'on':''}" onclick="state.sceneId='${x.scene_id}';render()"><td class="mono">${x.scene_id}</td><td class="small">${esc(x.scene)}</td>${['base','tuned'].map(m=>{const sc=x.scoring[m];return `<td>${sc.pass===null?pill('N/A','na'):sc.pass?pill('통과','pass'):pill('실패','fail')}</td>`;}).join('')}<td>${x.scoring.base.pass!==x.scoring.tuned.pass?pill('달라짐','neutral'):''}</td></tr>`).join('');
  document.getElementById('app').innerHTML=`
  ${head('모델 비교')}
  <div class="head"><button class="ghost" onclick="go('report')">← Report</button><h1>모델 비교</h1><span class="crumb">같은 장면에서 두 모델의 판단이 어떻게 다른가</span></div>
  <div class="grid cols-2" style="grid-template-columns:minmax(0,.9fr) minmax(0,1.4fr);align-items:start">
    <div class="card tablewrap" style="padding:4px 6px"><table><tr><th>scene</th><th>장면</th><th>Base</th><th>Tuned</th><th></th></tr>${rows}</table></div>
    <div class="section">
      <div class="head"><h2 class="mono">${s.scene_id}</h2>${s.conditions.map(c=>pill(c,'dim')).join('')}<span class="sp"></span><button class="sm" onclick="go('scene',{sceneId:'${s.scene_id}'})">F5 장면 상세 →</button></div>
      <div class="scene">${sceneSVG(s,'tuned',{layers:{c:true,gt:true,pred:false}})}<span class="tag pill mock">가상 이미지 · 정답 레이어만</span></div>
      <div class="cmp">${['base','tuned'].map(m=>modelCol(s,m)).join('')}</div>
    </div>
  </div>
  ${dev('F4 백엔드 요구',`<code>GET /scenes/{scene_id}?runs=run_a,run_b</code> → reference + predictions{run_a,run_b} + scoring{run_a,run_b}. F5와 같은 응답, run 2개.`)}`;
}
function modelCol(s,m){
  const p=s.predictions[m],sc=s.scoring[m];
  if(!p.valid)return `<div class="col ${m==='base'?'a':'b'}"><h2>${pill(mlabel(m),m==='base'?'neutral':'pred')} ${esc(M[m].desc)}</h2><div class="notice fail">${pill('Invalid','fail')} 모델 출력 형식 오류 · 채점 불가<br><span class="mono small">${esc(p.raw_excerpt)}…</span></div></div>`;
  return `<div class="col ${m==='base'?'a':'b'}"><h2>${pill(mlabel(m),m==='base'?'neutral':'pred')} <span class="muted small" style="font-weight:400">${esc(M[m].desc)}</span><span class="sp"></span>${sc.pass===null?pill('N/A','na'):sc.pass?pill('통과','pass'):pill('실패','fail')}</h2>
    <dl class="kv"><dt>근거</dt><dd>${[...p.objects,...p.regions].length?[...p.objects,...p.regions].map(o=>`<span class="mono">${o.id}′</span> ${esc(o.class)}`).join(' · '):'<span class="muted">없음</span>'}</dd><dt>속성</dt><dd>${sceneAttrs(p.scene)}</dd>
    <dt>관계</dt><dd>${['R1','R2','R3','R4'].map(r=>{const v=sc.relations[r];return `<span class="mono small">${r}</span> ${pau(v?v.pred:null)}${v&&v.ok===false?' <span class="pill fail">≠정답</span>':''}`;}).join(' &nbsp; ')}</dd>
    <dt>대응</dt><dd class="actlist">${p.actions.map(actPair).join('')}</dd>
    <dt>사유</dt><dd>${sc.fail_labels.length?sc.fail_labels.map(l=>pill(l,'fail')).join(' '):'<span class="muted">—</span>'}</dd>
    <dt>설명</dt><dd class="small">${esc(p.explanation)}${sc.explain_ok===false?`<br>${pill('설명 오류','fail')} <span class="muted">${esc(sc.explain_note)}</span>`:''}</dd></dl></div>`;
}

/* ---------- F5 장면 상세 ---------- */
function renderScene(){
  const list=filtered();const s=scenes.find(x=>x.scene_id===state.sceneId)||list[0]||scenes[1];state.sceneId=s.scene_id;
  const idx=list.findIndex(x=>x.scene_id===s.scene_id),m=state.model,ref=s.reference,p=s.predictions[m],sc=s.scoring[m];
  const refObj=[...ref.objects.map(objLabel),...ref.regions.map(o=>`<span class="mono">${o.id}</span> ${esc(o.class)} <span class="muted small">Region</span>`)].join(' · ');
  const grm=Object.fromEntries(ref.relations.map(r=>[r.code,r]));const refRel=['R1','R2','R3','R4'].map(r=>{const v=grm[r];return `<span class="mono small">${r}</span> ${pau(v?v.state:null)}${v&&v.evidence.length?` <span class="muted small">(${v.evidence.join(', ')})</span>`:''}`;}).join(' &nbsp; ');
  const acts=ref.actions;
  const inGroups=acts?new Set(acts.required_groups.flatMap(g=>g.alts.map(a=>a.join('|')))):new Set();
  const refAct=acts?`<div class="actlist">${acts.required_groups.map((g,i)=>`<span class="a">${pill('필요 묶음 '+(i+1),'pass')}<span class="muted small">${esc(g.why)} →</span> ${g.alts.map(actPair).join(' <span class="muted small">또는</span> ')}</span>`).join('')}${acts.allowed.filter(a=>!inGroups.has(a.join('|'))).map(a=>`<span class="a">${pill('허용','dim')}${actPair(a)}</span>`).join('')}${acts.forbidden.map(a=>`<span class="a">${pill('금지','fail')}${actPair(a)}</span>`).join('')}</div>`:s.missing?pill('Missing · 검수 전','warn'):pill('Not applicable · 방향 충돌 장면은 대응 평가 제외','na');
  const banner=s.missing?`<div class="notice">${pill('Missing','warn')} ${esc(s.missing)}. 채점에서 제외되었고 사유를 공개합니다.</div>`:(!acts&&p.valid)?`<div class="notice">${pill('Not applicable','na')} Direction Match = Conflicting · 맞는 대응이 존재하지 않아 대응 평가(V10–V12)에서 제외. 관계(V5–V9)·속성(A1·A2)은 채점.${sc.diag.length?' · '+sc.diag.map(d=>pill(DIAG[d].label,'neutral')).join(' '):''}</div>`
    :!p.valid?`<div class="notice fail">${pill('Invalid','fail')} 모델 출력 형식 오류 · 채점 불가 · 대응 평가 실패 사유: 형식 오류 <button class="sm" onclick="go('run')">F1에서 재실행</button></div>`
    :sc.pass?`<div class="notice pass"><b>대응 평가 통과</b>${sc.diag.length?' · 그러나 '+sc.diag.map(d=>pill(DIAG[d].label,'neutral')).join(' ')+' — 대응이 맞아도 근거·관계·설명까지 맞다는 뜻은 아닙니다.':''}</div>`
    :`<div class="notice fail"><b>대응 평가 실패</b> · ${sc.fail_labels.map(l=>pill(l,'fail')).join(' ')} · ${sc.diag.map(d=>pill(DIAG[d].label,'neutral')).join(' ')}</div>`;
  const predChain=!p.valid?'':`
      <div class="chain"><div class="step pred"><div class="t">${pill('예측','pred')} 근거 Object · Region</div><div>${[...p.objects,...p.regions].length?[...p.objects,...p.regions].map(o=>{const mt=sc.boxes.matched.find(x=>x.pred===o.id);const ex=sc.boxes.extra.includes(o.id);return `<span class="mono">${o.id}′</span> ${esc(o.class)} ${mt?`<span class="pill pass">↔ ${mt.gt} IoU ${mt.iou}</span>`:ex?'<span class="pill fail">정답과 짝 없음</span>':''}`;}).join(' · '):'<span class="muted">없음</span>'}${sc.boxes.missed.length?`<br><span class="pill fail">누락</span> <span class="small muted">정답 ${sc.boxes.missed.join(', ')} 짝 없음</span>`:''}<br><span class="small">${sceneAttrs(p.scene)}</span></div></div>
      <div class="arrow">↓</div><div class="step pred"><div class="t">${pill('예측','pred')} 관계 판정 · 근거 ID</div><div class="rels">${['R1','R2','R3','R4'].map(r=>{const g=sc.relations[r];const em=sc.evidence_match[r];return `<div class="rel"><span class="n">${r} ${REL[r].label}</span><div class="vs">${pau(g?g.pred:null)}${g&&g.ok===false?`<span class="pill fail">정답 ${g.gt}</span>`:g&&g.ok?'<span class="pill pass">일치</span>':''}</div>${g&&g.pred_evidence.length?`<span class="small muted">근거 ${g.pred_evidence.join(', ')}${em===true?' ✓':em===false?' <span class="pill fail">V4 불일치</span>':''}</span>`:em===false?'<span class="pill fail">근거 없음</span>':''}</div>`;}).join('')}</div></div>
      <div class="arrow">↓</div><div class="step pred last"><div class="t">${pill('예측','pred')} 대응 · (대응, 조건) 쌍</div><div class="actlist">${p.actions.map(a=>{const key=a.code+'|'+a.condition;const fb=acts&&acts.forbidden.some(x=>x.join('|')===key),al=acts&&acts.allowed.some(x=>x.join('|')===key),req=inGroups.has(key);const prm=Object.fromEntries(p.relations.map(r=>[r.code,r]));const needs={while_corridor_occupied:['R1',['P']],while_actor_near_entrance:['R2',['P']],before_entering_occluded_area:['R3',['P']],before_passing_restricted_section:['R4',['P','U']]}[a.condition];const contra=needs&&(!needs[1].includes(prm[needs[0]]&&prm[needs[0]].state)||!a.based_on.includes(needs[0]));return `<span class="a">${actPair(a)}${!acts?'':contra?pill('관계 판정과 모순','fail'):fb?pill('금지','fail'):req?pill('필요 묶음 충족','pass'):al?pill('허용','dim'):pill('근거 확인되지 않음','fail')}</span>`;}).join('')}${acts?acts.required_groups.map((g,i)=>sc.groups_hit&&sc.groups_hit[i]?'':`<span class="a">${pill('묶음 '+(i+1)+' 누락','fail')}<span class="muted small">${g.alts.map(x=>actLabel(x[0])).join(' 또는 ')}</span></span>`).join(''):''}</div></div></div>`;
  document.getElementById('app').innerHTML=`
  ${head('장면 상세 · '+s.scene_id)}
  <div class="head"><button class="ghost" onclick="go('errors')">← 목록 (필터 유지)</button><h1 class="mono" style="font-size:16px">${s.scene_id}</h1>${s.conditions.map(c=>pill(c,'dim')).join('')}
    <span class="filters"><span class="lbl" style="min-width:0">모델</span>${['base','tuned'].map(x=>`<button class="sm ${m===x?'on':''}" onclick="state.model='${x}';render()">${mlabel(x)}</button>`).join('')}</span>
    <span class="sp"></span><button class="sm" ${idx<=0?'disabled':''} onclick="go('scene',{sceneId:'${list[idx-1]?.scene_id}'})">← 이전</button><span class="muted num small">${idx>=0?idx+1:'–'} / ${list.length}</span><button class="sm" ${idx<0||idx>=list.length-1?'disabled':''} onclick="go('scene',{sceneId:'${list[idx+1]?.scene_id}'})">다음 →</button></div>
  ${banner}
  <div class="grid cols-2" style="grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);align-items:start">
    <div class="wrapcol section">${sceneBox(s,m)}<div class="small muted">${esc(s.scene)}. 좌표는 0–1 정규화, Box 짝짓기는 IoU>0.5.</div>
      <div class="card flat"><dl class="kv"><dt>정답 출처</dt><dd>${esc(ref.source)} · Source Group ${esc(s.source_group)}</dd><dt>검수 상태</dt><dd>${ref.review_status==='Reviewed'?pill('Reviewed','pass'):pill(ref.review_status,'warn')}</dd><dt>C</dt><dd class="small">진행 의도와 도로 구조만으로 정한 평가 영역(가상 주행 복도). 모델에는 제공하지 않음.</dd></dl></div></div>
    <div class="wrapcol section"><h3>근거 → 관계 → 대응</h3>
      <div class="chain"><div class="step gt"><div class="t">${pill('GT','gt')} 근거 Object</div><div>${refObj||'<span class="muted">없음</span>'}</div></div>
        <div class="arrow">↓</div><div class="step gt"><div class="t">${pill('GT','gt')} 관계 · 근거 ID</div><div>${refRel}</div><div class="small">${sceneAttrs(ref.scene)}</div></div>
        <div class="arrow">↓</div><div class="step gt last"><div class="t">${pill('GT','gt')} 대응 · 필요 / 허용 / 금지</div>${refAct}</div></div>
      ${predChain?`<h3 style="margin-top:8px">${esc(M[m].label)} · ${esc(M[m].desc)}</h3>${predChain}
      <div class="card flat small"><b>설명</b> ${esc(p.explanation)}${sc.explain_ok===false?`<br>${pill('설명 오류','fail')} ${esc(sc.explain_note)}`:sc.explain_ok?`<br>${pill('검수 적절','pass')}`:''}</div>`:''}
    </div>
  </div>
  <div class="card flat small muted"><b>P/A/U</b> · P ${meta.pau.P} · A ${meta.pau.A} · U ${meta.pau.U} &nbsp;|&nbsp; <b>빈 값</b> · Invalid ${meta.empty_values.Invalid} · Missing ${meta.empty_values.Missing} · Not applicable ${meta.empty_values['Not applicable']}</div>
  ${dev('F5 백엔드 요구',`<code>GET /scenes/{scene_id}?run=run_id</code> → image_url, C[[x,y]], reference{objects[{id,class,kind,placement,bbox}], regions[{id,class,bbox}], scene{sidewalk_left,sidewalk_right,traffic_direction,direction_match}, relations[{code,state,evidence[]}], actions{required_groups[{why,alts[[code,condition]]}],allowed,forbidden}|null, source, review_status}, prediction{valid, objects, regions, scene, relations, actions[{code,condition,based_on}], explanation, raw_excerpt} (App.B.4 출력 Schema), scoring{pass, fail_reasons[], diag[], relations{..:{gt,pred,ok,gt_evidence,pred_evidence}}, evidence_match{}, boxes{matched[{gt,pred,iou}],missed,extra}, groups_hit[], explain_ok, explain_note}. 이전/다음은 F3 필터와 같은 쿼리.`)}`;
}
const v0=location.hash.replace('#','');if(VIEWS.includes(v0))state.view=v0;
render();
</script>
