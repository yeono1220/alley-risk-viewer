<title>생활도로 VLM 평가 뷰어</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>

:root{

}

  --danger:#f0918a; --danger-soft:#3a2321; --warn:#e4b65e; --warn-soft:#382d15; --ok:#86cc9a;
  --mock:#f2a65f; --mock-soft:#3a2b19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141618; --panel:#1d2024; --panel-2:#22262b; --fg:#e8e6e1; --muted:#9b9fa6; --line:#2e3238; --line-2:#3f444c;
  --accent:#86aee6; --accent-soft:#1d2a3f; --accent-ink:#0f1419;
  --gt:#86cc9a; --gt-soft:#1c2f23; --pred:#c7a3ee; --pred-soft:#2c2139;

h1,h2,h3{margin:0;text-wrap:balance;font-weight:600}
h1{font-size:17px}h2{font-size:15px}
h3{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:500}
a{color:var(--accent)}
button,select,input[type=text]{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line-2);border-radius:7px;padding:6px 11px}
button{cursor:pointer}button:hover{border-color:var(--accent)}button:disabled{opacity:.5;cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:500}
button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
button.ghost{background:transparent;border-color:transparent;color:var(--muted)}button.ghost:hover{color:var(--accent)}
.shell{display:grid;grid-template-columns:200px minmax(0,1fr);gap:28px;max-width:1240px;margin:0 auto}
@media (max-width:860px){.shell{grid-template-columns:1fr;gap:12px}}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);align-self:start;display:flex;flex-direction:column;gap:4px;padding-top:20px}
@media (max-width:860px){.rail{position:static;flex-direction:row;flex-wrap:wrap;padding-top:12px}}
.brand{padding:0 10px 14px;display:grid;gap:6px}
.brand .t{font-weight:600;font-size:15px}
.rail a.nav{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:7px;color:var(--muted);text-decoration:none;font-size:13.5px}
.rail a.nav .k{font-family:var(--mono);font-size:11px;width:22px;color:var(--muted)}
.rail a.nav:hover{background:var(--panel)}
.rail a.nav.cur{background:var(--panel);color:var(--fg);box-shadow:inset 3px 0 0 var(--accent)}
.rail a.nav.cur .k{color:var(--accent)}
.railfoot{margin-top:18px;padding:0 10px;display:grid;gap:6px;font-size:11.5px;color:var(--muted)}
.main{padding-top:20px;display:grid;gap:22px;min-width:0}
.head{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.head .crumb{font-size:12.5px;color:var(--muted)}
.head .crumb b{color:var(--fg);font-weight:500}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:500;white-space:nowrap;line-height:1.5}
.pill.mock{background:var(--mock-soft);color:var(--mock)}
.pill.gt{background:var(--gt-soft);color:var(--gt)}
.pill.pred{background:var(--pred-soft);color:var(--pred)}
.pill.err{background:var(--danger-soft);color:var(--danger)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--gt-soft);color:var(--ok)}
.pill.neutral{background:var(--accent-soft);color:var(--accent)}
.pill.dim{background:var(--panel-2);color:var(--muted);border:1px solid var(--line)}
.mono{font-family:var(--mono);font-size:12px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card.flat{background:var(--panel-2)}
.section{display:grid;gap:10px}
.grid{display:grid;gap:10px}
.cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:900px){.cols-4,.cols-3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.cols-4,.cols-3,.cols-2{grid-template-columns:1fr}}
.stat{display:grid;gap:2px;padding:14px 16px}
.stat .label{font-size:12px;color:var(--muted)}
.stat .val{font-size:28px;font-weight:600;line-height:1.15;letter-spacing:-.01em}
.stat .val.unm{font-size:15px;color:var(--muted);font-weight:500}
.stat .sub{font-size:11.5px;color:var(--muted);margin-top:4px}
.stat.click{cursor:pointer;transition:border-color .12s}.stat.click:hover{border-color:var(--accent)}
.stat.click .val{color:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11.5px;color:var(--muted);font-weight:500;letter-spacing:.03em}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
.tablewrap{overflow-x:auto}
tr.row{cursor:pointer}tr.row:hover td{background:var(--panel-2)}
.cnt{color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.filters .lbl{font-size:12px;color:var(--muted);margin-right:4px;min-width:56px}
.filters button{padding:4px 10px;font-size:12.5px}
.thumb{width:76px;height:50px;border-radius:5px;border:1px solid var(--line);flex:none;overflow:hidden;background:#8d9aa6}
.thumb svg,.scene svg,.scene img{display:block;width:100%;height:100%;object-fit:cover}
.scene{position:relative;aspect-ratio:16/10;max-width:100%;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#8d9aa6}
.scene .tag{position:absolute;top:10px;left:10px}
.zoom{position:absolute;right:10px;bottom:10px;display:flex;gap:4px}
.zoom button{padding:3px 9px;font-size:12px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:860px){.cmp{grid-template-columns:1fr}}
.col{border-radius:var(--r);padding:16px;border:1px solid var(--line);background:var(--panel);min-width:0;position:relative}
.col::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;border-radius:var(--r) var(--r) 0 0}
.col.gt::before{background:var(--gt)}.col.pred::before{background:var(--pred)}

.kv{display:grid;grid-template-columns:84px 1fr;gap:8px 12px;font-size:13px;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0;min-width:0}
.kv dd.empty{color:var(--muted);font-style:italic}
.notice{border-left:3px solid var(--warn);background:var(--warn-soft);padding:9px 13px;border-radius:0 7px 7px 0;font-size:13px}

.notice.ok{border-color:var(--ok);background:var(--gt-soft)}
.empty{padding:44px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line-2);border-radius:var(--r);display:grid;gap:10px;justify-items:center}

details.dev summary::before{content:"›";display:inline-block;transition:transform .12s}

details.dev .body{margin-top:8px;padding:10px 12px;background:var(--panel-2);border-radius:7px;line-height:1.6}
details.dev code{font-family:var(--mono);font-size:11px;background:var(--accent-soft);color:var(--accent);padding:0 5px;border-radius:3px}
.skel{height:14px;border-radius:4px;background:linear-gradient(90deg,var(--line),var(--panel),var(--line));background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}.stat.click{transition:none}}
.listrow{display:flex;gap:10px;align-items:flex-start}
.wrapcol{min-width:0}
.sp{flex:1}
/* inference */
.drop{border:1.5px dashed var(--line-2);border-radius:var(--r);padding:28px 16px;text-align:center;color:var(--muted);cursor:pointer;display:grid;gap:6px;justify-items:center;background:var(--panel-2)}
.drop:hover,.drop.over{border-color:var(--accent);color:var(--accent)}
.drop input{display:none}
.field{display:grid;gap:5px}
.field label{font-size:12px;color:var(--muted)}
.field input[type=text],.field select{width:100%}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.presets button{padding:4px 10px;font-size:12.5px}
.status{display:flex;gap:8px;align-items:center;font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line-2)}
.dot.run{background:var(--accent);animation:pulse 1s infinite}.dot.ok{background:var(--ok)}.dot.err{background:var(--danger)}.dot.warn{background:var(--warn)}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.dot.run{animation:none}}
pre.json{margin:0;font-family:var(--mono);font-size:11.5px;line-height:1.5;background:var(--panel-2);padding:12px;border-radius:7px;overflow-x:auto;white-space:pre}
.steps{display:flex;gap:0;font-size:12px;color:var(--muted);flex-wrap:wrap}
.steps span{padding:3px 10px;border:1px solid var(--line);margin-left:-1px}
.steps span:first-child{border-radius:6px 0 0 6px}.steps span:last-child{border-radius:0 6px 6px 0}
.steps span.cur{color:var(--accent);border-color:var(--accent);background:var(--accent-soft);position:relative;z-index:1}

function scene(c, w=320, h=200){
  const night=c.conditions.includes('야간');
  const sky=night?'#2b3040':'#cfd8e0', road=night?'#4a4f58':'#8d9aa6', wall=night?'#3a3e48':'#b9b3a6';
  const o=c.gt.objects; let objs='';
  const car=(x,y,s)=>`<rect x="${x}" y="${y}" width="${34*s}" height="${18*s}" rx="3" fill="#5b6773" stroke="#2c333b"/>`;
  const ped=(x,y,s,col='#d94a3d')=>`<circle cx="${x}" cy="${y}" r="${5*s}" fill="${col}"/><rect x="${x-4*s}" y="${y+5*s}" width="${8*s}" height="${16*s}" rx="2" fill="${col}"/>`;
  let pc=0,cc=0;
  o.forEach(ob=>{
    if(ob==='주차 차량'){objs+=car(cc%2?70:216,120+cc*8,1);cc++;}
    else if(ob==='맞은편 차량'){objs+=car(150,105,.8);}
    else if(ob==='보행자'){objs+=ped(150+pc*22,118,1);pc++;}
    else if(ob==='어린이'){objs+=`<rect x="236" y="118" width="30" height="22" fill="${road}"/>`+ped(222,126,.6,'#e3a12f');}
    else if(ob==='적치물'){objs+=`<rect x="190" y="110" width="80" height="40" fill="#e0a33a" stroke="#8a5a00"/><line x1="190" y1="110" x2="270" y2="150" stroke="#8a5a00"/>`;}
  });

  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="가상 장면: ${esc(c.scene)}">
  <rect width="${w}" height="${h}" fill="${sky}"/><rect x="0" y="60" width="${w}" height="${h}" fill="${wall}"/>
  <polygon points="130,60 190,60 ${w},${h} 0,${h}" fill="${road}"/>${objs}
  ${night?`<circle cx="60" cy="40" r="10" fill="#ffd97a" opacity=".8"/><rect x="0" y="60" width="${w}" height="${h}" fill="#000" opacity=".35"/>`:''}
  <text x="6" y="${h-6}" font-size="9" fill="#fff" opacity=".8" font-family="monospace">placeholder · ${c.sample_id}</text></svg>`;
}

  setTimeout(()=>{I.log.push(`[${ts()}] status=running (GPU 큐)`);render();},600);
  setTimeout(()=>{

    <div class="card tablewrap" style="padding:4px 6px"><table>
      <tr><th>요인</th><th class="num">n</th><th class="num">TP</th><th class="num">미탐</th><th class="num">오경보</th><th class="num">보류</th><th class="num">실패</th><th class="num">Recall</th><th class="num">Precision</th><th>비고</th></tr>
      ${run.by_factor.map(f=>`<tr class="row" onclick="go('cases',{filters:{error:[],factor:'${f.factor_id}'}})"><td><span class="mono muted">${f.factor_id}</span> ${f.factor_label}</td><td class="num">${f.n}</td><td class="num">${f.tp}</td><td class="num">${f.fn}</td><td class="num">${f.fp}</td><td class="num">${f.abstain}</td><td class="num">${f.failure}</td><td class="num">${f.recall==null?'<span class="muted">—</span>':pct(f.recall)}</td><td class="num">${f.precision==null?'<span class="muted">—</span>':pct(f.precision)}</td><td class="muted small">${esc(f.note||'')}</td></tr>`).join('')}
    </table></div>
    <div class="muted small">표본이 작아 신뢰구간을 계산하지 않았습니다. 순위만으로 개선 우선순위를 확정하지 않습니다.</div></div>
  ${dev('F1 백엔드 요구',`<code>GET /runs</code> (run_id, run_label, model_label, dataset_id, data_kind) · <code>GET /runs/{run_id}/summary</code> (metrics · counts · error_counts · by_factor, run.json 구조) · 미측정은 <code>null + status:"unmeasured"</code>, 0으로 보내지 않음.`)}`;
}

/* ---------- F2 목록 ---------- */
function renderCases(){
  const list=filtered();
  const errBtn=id=>`<button class="${state.filters.error.includes(id)?'on':''}" onclick="toggleErr('${id}')">${ERR[id].label}</button>`;
  document.getElementById('app').innerHTML=`
  ${head('오류 목록')}
  <div class="head"><button class="ghost" onclick="go('summary')">← 요약</button><h1>오류 사례</h1><span class="muted num">${list.length}건</span></div>
  <div class="card section">
    <div class="filters"><span class="lbl">오류 유형</span>${taxonomy.error_types.map(e=>errBtn(e.id)).join('')}<button class="ghost" onclick="state.filters.error=[];render()">전체</button></div>
    <div class="filters"><span class="lbl">위험 요인</span><select onchange="state.filters.factor=this.value||null;render()"><option value="">전체</option>${taxonomy.factors.map(f=>`<option value="${f.id}" ${state.filters.factor===f.id?'selected':''}>${f.id} ${f.label}</option>`).join('')}</select>
    <span class="lbl" style="margin-left:10px">정렬</span><select><option>오류 유형 → sample_id</option><option disabled>confidence (미정)</option></select></div>
  </div>
  ${list.length===0?`<div class="empty"><b>조건에 맞는 사례가 없습니다</b><button onclick="state.filters={error:[],factor:null};render()">필터 해제</button></div>`:`
  <div class="card tablewrap" style="padding:4px 6px"><table>
    <tr><th></th><th>sample</th><th>장면 (가상)</th><th>GT</th><th>예측</th><th>오류 유형</th><th>요인</th><th>상태</th></tr>
    ${list.map(c=>`<tr class="row" onclick="go('detail',{caseId:'${c.sample_id}'})">
      <td><div class="thumb">${scene(c,76,50)}</div></td><td class="mono">${c.sample_id}</td><td style="min-width:200px">${esc(c.scene)}</td>
      <td>${c.status==='label_review'?pill('재검토','warn'):judg(c.gt.judgment)}</td><td>${c.pred?judg(c.pred.judgment):pill('없음','dim')}</td>
      <td>${c.error_types.map(errPill).join(' ')||'<span class="muted">—</span>'}</td><td class="mono muted">${c.gt.factors.join(', ')}</td><td class="mono muted small">${c.status}</td></tr>`).join('')}
  </table></div>`}
  ${dev('F2 백엔드 요구',`<code>GET /runs/{run_id}/cases?error_type=miss,hallucination&factor=F2&status=&page=1&size=50</code> → 행마다 sample_id, thumbnail_url, scene, gt.judgment, pred.judgment, error_types[], gt.factors[], status. 페이지네이션은 200장 이상이면 필요. 정렬 기준은 confidence 정의 후 추가.`)}`;
}
function toggleErr(id){const a=state.filters.error;const i=a.indexOf(id);i>=0?a.splice(i,1):a.push(id);render();}

/* ---------- F3 상세 ---------- */
function renderDetail(){
  const list=filtered(); let idx=list.findIndex(c=>c.sample_id===state.caseId);
  const c=cases.find(x=>x.sample_id===state.caseId)||list[0]; if(!c){go('cases');return;}
  const p=c.pred,g=c.gt;
  const dd=v=>v==null||(Array.isArray(v)&&v.length===0)?'<dd class="empty">미등록</dd>':`<dd>${Array.isArray(v)?v.map(esc).join(', '):esc(v)}</dd>`;
  const cmp=(()=>{
    if(c.status==='label_review')return `<div class="notice">GT 미확정 · ${esc(g.review_reason)} — 채점에서 제외되었고 사유를 공개합니다.</div>`;
    if(c.status==='format_error'||c.status==='call_failed')return `<div class="notice err"><b>${c.failure.code}</b> ${esc(c.failure.message)} · 재시도 ${c.failure.retry_count}회 · ${c.failure.retryable?'재시도 가능':'재시도 불가'} · 모델 판단 보류와는 다른 상태 <button onclick="go('infer')">F0에서 재실행</button></div><details class="dev"><summary>원본 응답 일부</summary><div class="body"><pre class="json" style="background:transparent;padding:0">${esc(c.raw_response_excerpt)}</pre></div></details>`;
    if(c.status==='abstain')return `<div class="notice">판단 보류 · 사유: ${esc(p.abstain_reason)} · 부족한 정보: ${esc(p.limits)}. '낮은 위험'으로 해석하지 않으며 보수적 집계에서는 미검출로 포함됩니다.</div>`;
    const same=g.judgment===p.judgment;
    return `<div class="notice ${same?(c.error_types.length?'':'ok'):'err'}"><b>판정 ${same?'일치':'불일치'}</b> · ${c.error_types.length?c.error_types.map(errPill).join(' '):'기록된 오류 없음'}${same&&c.error_types.length?' — 판정이 맞아도 근거까지 맞다는 뜻은 아닙니다. 아래 근거를 따로 읽으세요.':''}</div>`;
  })();
  document.getElementById('app').innerHTML=`
  ${head('오류 목록 · '+c.sample_id)}
  <div class="head"><button class="ghost" onclick="go('cases')">← 목록 (필터 유지)</button><h1 class="mono" style="font-size:16px">${c.sample_id}</h1>${c.conditions.map(t=>pill(t,'dim')).join('')}
    <span class="sp"></span><button ${idx<=0?'disabled':''} onclick="go('detail',{caseId:'${list[idx-1]?.sample_id}'})">← 이전</button><span class="muted num small">${idx+1} / ${list.length}</span><button ${idx>=list.length-1?'disabled':''} onclick="go('detail',{caseId:'${list[idx+1]?.sample_id}'})">다음 →</button></div>
  ${cmp}
  <div class="grid cols-2" style="grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:start">
    <div class="wrapcol section">
      <div class="scene" id="scene">${scene(c)}<span class="tag pill mock">가상 이미지</span><div class="zoom"><button onclick="zoomScene(1.5)">＋</button><button onclick="zoomScene(1)">1:1</button></div></div>
      <div class="muted small">${esc(c.scene)}. bbox 오버레이(GT/예측 구분)는 좌표 규약 협의 후 추가.</div>
    </div>
    <div class="card wrapcol section">
      <h3>검수 결과</h3>
      ${c.review?`<dl class="kv"><dt>검수자</dt><dd>${esc(c.review.reviewer)}</dd><dt>근거 적절</dt><dd>${c.review.evidence_ok==null?'<span class="muted">검수 보류</span>':c.review.evidence_ok?pill('적절','ok'):pill('부적절','err')}</dd><dt>메모</dt><dd>${esc(c.review.note)}</dd></dl>`:'<p class="muted small">검수 기록 없음</p>'}
      <div style="display:flex;gap:6px;flex-wrap:wrap"><button>검토 메모</button><button>오류 유형 수정</button><button disabled>다른 모델과 비교 (미실행)</button></div>
    </div>
  </div>
  <div class="cmp">
    <div class="col gt"><h2>${pill('GT','gt')} 사람이 검수한 정답</h2>
      <dl class="kv"><dt>판정</dt><dd>${judg(g.judgment)} ${g.risk_level?pill(g.risk_level,'dim'):''}</dd><dt>위험 요인</dt>${dd(g.factors.map(f=>f+' '+FAC[f].label))}<dt>관측 객체</dt>${dd(g.objects)}<dt>근거</dt>${dd(g.evidence)}<dt>허용 행동</dt>${dd(g.allowed_actions)}</dl>
      <div class="muted small" style="margin-top:10px">라벨 ${run.dataset.label_version} · taxonomy ${run.dataset.taxonomy_version}</div>
    </div>
    <div class="col pred"><h2>${pill('예측','pred')} 모델 출력 <span class="muted small" style="font-weight:400">${run.model.model_label}</span></h2>
      ${p?`<dl class="kv"><dt>판정</dt><dd>${judg(p.judgment)} ${p.risk_level?pill(p.risk_level,'dim'):''}</dd><dt>위험 요인</dt>${dd(p.factors.map(f=>f+' '+FAC[f].label))}<dt>관측 객체</dt>${dd(p.objects)}<dt>관측 사실</dt>${dd(p.observed)}<dt>추론</dt>${dd(p.inference)}<dt>권장 행동</dt>${dd(p.action)}<dt>판단 한계</dt>${dd(p.limits)}
      <dt>confidence</dt><dd>${pill('미정','warn')} <span class="muted small">산출·보정 방법 확정 전 · 사고 확률 아님</span></dd></dl>`:'<p class="muted small">출력 없음 (실행 실패)</p>'}
    </div>
  </div>
  ${dev('F3 백엔드 요구',`<code>GET /runs/{run_id}/cases/{sample_id}</code> → image_url(고해상도), gt{judgment,risk_level,factors[],objects[],evidence,allowed_actions[]}, pred{…,observed,inference,action,limits,confidence:null,abstain_reason}, status, failure{code,message,retry_count}, review{reviewer,evidence_ok,note}, error_types[]. <code>POST …/review</code> 메모·오류 유형 저장. 이전/다음은 F2와 같은 필터 쿼리로 계산.`)}`;
}
let z=1;function zoomScene(f){z=f;const s=document.querySelector('#scene svg');if(s){s.style.transform=`scale(${z})`;s.style.transformOrigin='center';}}
const v0=location.hash.replace('#','');if(VIEWS.includes(v0))state.view=v0;if(state.view==='detail'&&!state.caseId)state.caseId='S-002';
render();
</script>
